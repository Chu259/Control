name: Build Android APK (depos)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install Dependencies
      run: bun install --no-frozen-lockfile

    - name: Build Web Project
      run: bun run build

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Accept Android Licenses
      run: |
        mkdir -p ${ANDROID_HOME}/licenses
        echo "24a33b3b76e16e61e065bc902bb9db0135a0f140" > ${ANDROID_HOME}/licenses/android-sdk-license
        echo "849d667a4e287d58fa0bc195b78d21bbd3217988" >> ${ANDROID_HOME}/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb74314b1ae7f2261cc3" > ${ANDROID_HOME}/licenses/android-sdk-preview-license

    - name: Setup Capacitor
      run: |
        bun add @capacitor/core @capacitor/cli @capacitor/android
        if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
          bunx cap init "depos" "com.depos.app" --web-dir dist
        fi
        bunx cap add android || true
        bunx cap sync android

    - name: Fix Gradle Permissions
      run: |
        chmod +x android/gradlew || true
        chmod 755 android/gradlew || true

    - name: Run Build Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Prepare APK with name depos
      run: |
        if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/depos.apk
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: depos-apk
        path: |
          android/app/build/outputs/apk/debug/depos.apk
          android/app/build/outputs/apk/debug/app-debug.apk
